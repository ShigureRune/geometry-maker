name: GALAXY MODE browser checks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'src/three/**'
      - 'src/App.tsx'
      - 'tests/three-galaxy.spec.ts'
      - '.github/workflows/three-galaxy-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/three-galaxy.spec.ts --fully-parallel --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galaxy-v4-seven-type-gallery-${{ matrix.shard }}
          path: |
            test-results/galaxy-v3-visible-disk.png
            test-results/galaxy-v4-*.png
            test-results/gas-probe-*.png
            test-results/galaxy-exposure-*.png
            test-results/galaxy-nucleus-zoom-high.png
            test-results/galaxy-star-lod-*.png
            test-results/galaxy-star-color-deep-zoom.png
            test-results/galaxy-gravity-on.png
            test-results/galaxy-moving-cores.png
            test-results/galaxy-stellar-nbody.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: galaxy-mode-browser-failures-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
