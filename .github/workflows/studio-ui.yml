name: Studio v2 UI browser checks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  push:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/studio-autosave.ts'
      - 'src/main.tsx'
      - 'src/studio-redesign.css'
      - 'src/StudioCommandPalette.tsx'
      - 'src/PreviewScreenshotDialog.tsx'
      - 'src/preview-screenshot.ts'
      - 'src/preview-screenshot.test.ts'
      - 'tests/preview-screenshot.spec.ts'
      - 'src/ScreenshotGalleryDialog.tsx'
      - 'src/screenshot-gallery.ts'
      - 'src/screenshot-gallery.test.ts'
      - 'tests/screenshot-gallery.spec.ts'
      - 'src/command-workspaces.ts'
      - 'src/command-workspaces.test.ts'
      - 'tests/command-workspaces.spec.ts'
      - 'src/SeedVaultControls.tsx'
      - 'src/SeedExplorerBoard.tsx'
      - 'src/seed-explorer.ts'
      - 'src/seed-vault.ts'
      - 'src/studio-reset.ts'
      - 'src/SettingsCategories.tsx'
      - 'src/three/settings.ts'
      - 'src/three/ThreePreview.tsx'
      - 'src/three/ThreeControls.tsx'
      - 'src/three/NebulaLayer.tsx'
      - 'src/three/nebula-volume.ts'
      - 'src/three/nebula-volume.test.ts'
      - 'src/three/NebulaModeControls.tsx'
      - 'src/three/nebula-settings.ts'
      - 'src/three/nebula-settings.test.ts'
      - 'tests/nebula-mode.spec.ts'
      - 'tests/fine-settings.spec.ts'
      - 'src/three/ThreeControls.tsx'
      - 'src/three/VoidModeControls.tsx'
      - 'src/three/extension-presets.ts'
      - 'src/three/extension-presets.test.ts'
      - 'src/three/galaxy-presets.ts'
      - 'tests/extension-presets.spec.ts'
      - 'tests/fine-settings.spec.ts'
      - 'tests/studio-ui.spec.ts'
      - 'tests/ui-tactile.spec.ts'
      - 'tests/palette-export.spec.ts'
      - 'src/PaletteExportControls.tsx'
      - 'src/palette-export.ts'
      - 'src/palette-export.test.ts'
      - 'tests/export-resolution.spec.ts'
      - 'src/export-resolution.ts'
      - 'src/export-resolution.test.ts'
      - 'src/ExportPanel.tsx'
      - 'tests/studio-autosave.spec.ts'
      - 'tests/seed-vault.spec.ts'
      - 'tests/seed-history-explorer.spec.ts'
      - 'tests/seed-explorer.spec.ts'
      - 'tests/explorer-timeline.spec.ts'
      - 'src/explorer-timeline.ts'
      - 'src/explorer-timeline.test.ts'
      - '.github/workflows/studio-ui.yml'
  pull_request:
    paths:
      - 'src/App.tsx'
      - 'src/studio-autosave.ts'
      - 'src/main.tsx'
      - 'src/studio-redesign.css'
      - 'src/StudioCommandPalette.tsx'
      - 'src/PreviewScreenshotDialog.tsx'
      - 'src/preview-screenshot.ts'
      - 'src/preview-screenshot.test.ts'
      - 'tests/preview-screenshot.spec.ts'
      - 'src/ScreenshotGalleryDialog.tsx'
      - 'src/screenshot-gallery.ts'
      - 'src/screenshot-gallery.test.ts'
      - 'tests/screenshot-gallery.spec.ts'
      - 'src/command-workspaces.ts'
      - 'src/command-workspaces.test.ts'
      - 'tests/command-workspaces.spec.ts'
      - 'src/SeedVaultControls.tsx'
      - 'src/SeedExplorerBoard.tsx'
      - 'src/seed-explorer.ts'
      - 'src/seed-vault.ts'
      - 'src/studio-reset.ts'
      - 'src/SettingsCategories.tsx'
      - 'src/three/settings.ts'
      - 'src/three/ThreePreview.tsx'
      - 'src/three/ThreeControls.tsx'
      - 'src/three/NebulaLayer.tsx'
      - 'src/three/nebula-volume.ts'
      - 'src/three/nebula-volume.test.ts'
      - 'src/three/NebulaModeControls.tsx'
      - 'src/three/nebula-settings.ts'
      - 'src/three/nebula-settings.test.ts'
      - 'tests/nebula-mode.spec.ts'
      - 'tests/fine-settings.spec.ts'
      - 'src/three/ThreeControls.tsx'
      - 'src/three/VoidModeControls.tsx'
      - 'src/three/extension-presets.ts'
      - 'src/three/extension-presets.test.ts'
      - 'src/three/galaxy-presets.ts'
      - 'tests/extension-presets.spec.ts'
      - 'tests/fine-settings.spec.ts'
      - 'tests/studio-ui.spec.ts'
      - 'tests/ui-tactile.spec.ts'
      - 'tests/palette-export.spec.ts'
      - 'src/PaletteExportControls.tsx'
      - 'src/palette-export.ts'
      - 'src/palette-export.test.ts'
      - 'tests/export-resolution.spec.ts'
      - 'src/export-resolution.ts'
      - 'src/export-resolution.test.ts'
      - 'src/ExportPanel.tsx'
      - 'tests/studio-autosave.spec.ts'
      - 'tests/seed-vault.spec.ts'
      - 'tests/seed-history-explorer.spec.ts'
      - 'tests/seed-explorer.spec.ts'
      - 'tests/explorer-timeline.spec.ts'
      - 'src/explorer-timeline.ts'
      - 'src/explorer-timeline.test.ts'
      - '.github/workflows/studio-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test Studio v2 desktop and iPhone-size UI
        run: npx playwright test tests/studio-ui.spec.ts tests/studio-autosave.spec.ts tests/seed-vault.spec.ts tests/seed-explorer.spec.ts tests/seed-history-explorer.spec.ts tests/command-workspaces.spec.ts tests/explorer-timeline.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: studio-ui-failures
          path: test-results/
          retention-days: 7

  extension-presets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test creative presets, fullscreen settings, autosave and mobile dock
        run: npx playwright test tests/extension-presets.spec.ts tests/fine-settings.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: extension-presets-failures
          path: test-results/
          retention-days: 7

  nebula-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test NEBULA presets, live 3D, saved settings and iPhone inspector
        run: npx playwright test tests/nebula-mode.spec.ts tests/fine-settings.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nebula-browser-failures
          path: test-results/
          retention-days: 7

  tactile-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test tactile UI, live slider fill, reduced motion and mobile dock
        run: npx playwright test tests/ui-tactile.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tactile-ui-failures
          path: test-results/
          retention-days: 7

  export-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit-test export resolution logic
        run: npx vitest run src/export-resolution.test.ts
      - name: Browser-test export resolution UI
        run: npx playwright test tests/export-resolution.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: export-resolution-failures
          path: test-results/
          retention-days: 7

  palette-export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run src/palette-export.test.ts
      - run: npx playwright install --with-deps chromium
      - name: Test palette portability in the live editor
        run: npx playwright test tests/palette-export.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: palette-export-failures
          path: test-results/
          retention-days: 7

  preview-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run src/preview-screenshot.test.ts
      - run: npx playwright install --with-deps chromium
      - name: Test screenshot PNG, preview aspect, iPhone lightbox and native sharing
        run: npx playwright test tests/preview-screenshot.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preview-screenshot-failures
          path: test-results/
          retention-days: 7

  screenshot-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run src/screenshot-gallery.test.ts
      - run: npx playwright install --with-deps chromium
      - name: Test persisted gallery, iPhone thumbnail filters, PNG reuse and deletion
        run: npx playwright test tests/screenshot-gallery.spec.ts tests/preview-screenshot.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshot-gallery-failures
          path: test-results/
          retention-days: 7
