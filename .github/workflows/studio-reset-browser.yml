name: Studio reset controls browser checks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'src/App.tsx'
      - 'src/StudioResetControls.tsx'
      - 'src/studio-reset.ts'
      - 'src/studio-reset.test.ts'
      - 'tests/studio-reset.spec.ts'
      - '.github/workflows/studio-reset-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/studio-reset.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: studio-reset-browser-failures
          path: test-results/
          retention-days: 7
