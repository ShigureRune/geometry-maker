name: 3D particle mode browser checks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'src/three/**'
      - 'tests/three-particle.spec.ts'
      - '.github/workflows/three-particle-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/three-particle.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: three-particle-failures
          path: test-results/
          retention-days: 7
